spring:
  profiles: dev
  datasource:
    url: jdbc:h2:mem:huertohogar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  address: 127.0.0.1
  port: 8080
